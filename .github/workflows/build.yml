name: Build Desktop

on:
  # 允许在 GitHub Actions 页面手动运行
  workflow_dispatch:

  # 推送版本标签时自动构建
  # 例如：v0.1.0、v0.2.0
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows

          - os: macos-latest
            name: macOS

          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 构建 Web 前端
      - name: Build Web
        run: npm run build

      # 5. Electron 打包
      - name: Build Desktop
        run: npm run desktop:dist

      # 6. 上传构建结果
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeetingNotes-${{ matrix.name }}
          path: release/desktop/**
          if-no-files-found: error
