name: Build Desktop

on:
  # GitHub Actions 页面手动运行
  workflow_dispatch:

  # 推送版本标签时自动构建
  # 例如：v0.1.0、v0.2.0
  push:
    tags:
      - "v*"

# 当前工作流只需要读取仓库
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            name: Windows

          - os: macos-latest
            name: macOS

          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. 安装项目使用的 Node.js
      #
      # 注意：
      # 这里的 Node 22 是 easyMeeting 自己运行 npm/build 时使用的版本。
      # 和 GitHub Actions 内部使用 Node 24 是两回事。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      - name: Test Node
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Python
        run: |
          python -m pip install -r python/requirements.txt
          npm run test:python

      # 4. 构建 Web 前端
      - name: Build Web
        run: npm run build

      # 5. Electron 桌面端打包
      #
      # --publish never：
      # 禁止 electron-builder 在 CI 环境自动尝试发布 GitHub Release，
      # 避免因为没有 GH_TOKEN 导致打包成功后 CI 反而失败。
      - name: Build Desktop
        run: npm run desktop:dist -- --publish never

      # 6. 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MeetingNotes-${{ matrix.name }}
          path: release/desktop/**
          if-no-files-found: error
