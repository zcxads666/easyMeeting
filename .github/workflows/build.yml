name: Desktop CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CI: "true"
  MEETING_RUNTIME_AUTO_INSTALL: "0"

jobs:
  quality:
    name: Tests and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build web renderer
        run: npm run build

      - name: Create Python test runtime
        run: npm run setup:python

      - name: Run Node and system tests
        run: npm test

      - name: Run Python tests
        run: npm run test:python

      - name: Check patch whitespace
        run: git diff --check

  package:
    name: Package ${{ matrix.name }}
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CSC_LINK: ${{ matrix.name == 'Windows' && secrets.WINDOWS_CSC_LINK || matrix.name == 'macOS' && secrets.MACOS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.name == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || matrix.name == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.name == 'macOS' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.name == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            artifact: MeetingNotes-Windows
          - name: macOS
            os: macos-15
            artifact: MeetingNotes-macOS
          - name: Linux
            os: ubuntu-24.04
            artifact: MeetingNotes-Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-build.txt

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron distribution
        run: >-
          node node_modules/electron/install.js &&
          node -e "const fs=require('node:fs'); if(!fs.existsSync('node_modules/electron/dist')) throw new Error('Electron distribution is missing')"

      - name: Build offline Python Runtime prerequisites
        run: npm run setup:runtime-build

      - name: Build web renderer
        run: npm run build

      - name: Install Electron smoke dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          xvfb libnspr4 libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64
          libgbm1 libasound2t64

      - name: Electron smoke test
        if: runner.os == 'Linux'
        # GitHub-hosted Ubuntu blocks Chromium's namespace sandbox helper.
        # This flag is confined to the smoke process; production BrowserWindow
        # sandbox settings remain enabled and are covered by the security tests.
        run: >-
          xvfb-run -a env ELECTRON_SMOKE_TEST=1 ELECTRON_ENABLE_LOGGING=1
          timeout 60s npm run desktop -- --no-sandbox --disable-gpu

      - name: Require signing credentials for tagged releases
        if: github.ref_type == 'tag' && runner.os != 'Linux'
        env:
          HAS_SIGNING_CERT: ${{ (runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK != '') || (runner.os == 'macOS' && secrets.MACOS_CSC_LINK != '') }}
          HAS_NOTARIZATION: ${{ runner.os != 'macOS' || (secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '') }}
        run: node -e "if(process.env.HAS_SIGNING_CERT!=='true'||process.env.HAS_NOTARIZATION!=='true') throw new Error('Tagged desktop releases require platform signing and macOS notarization secrets')"

      - name: Build compiled Python Runtime
        run: npm run build:runtime

      - name: Package Windows
        if: runner.os == 'Windows'
        run: node scripts/build-desktop.mjs --win nsis --publish never

      - name: Package macOS
        if: runner.os == 'macOS'
        run: node scripts/build-desktop.mjs --mac dmg zip --publish never

      - name: Package Linux
        if: runner.os == 'Linux'
        run: node scripts/build-desktop.mjs --linux AppImage --publish never

      - name: Packaged startup smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:startup -- release/desktop

      - name: Packaged startup smoke (macOS)
        if: runner.os == 'macOS'
        run: npm run test:startup -- release/desktop

      - name: Packaged startup smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:startup -- release/desktop

      - name: Verify package contents
        run: npm run verify:package

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/desktop/*.exe
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.AppImage
            release/desktop/*.blockmap
            release/desktop/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package-macos-pr:
    name: Package macOS (pull request)
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: "true"
      MEETING_RUNTIME_AUTO_INSTALL: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-build.txt

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron distribution
        run: >-
          node node_modules/electron/install.js &&
          node -e "const fs=require('node:fs'); if(!fs.existsSync('node_modules/electron/dist')) throw new Error('Electron distribution is missing')"

      - name: Build offline Python Runtime prerequisites
        run: npm run setup:runtime-build

      - name: Build web renderer
        run: npm run build

      - name: Build compiled Python Runtime
        run: npm run build:runtime

      - name: Package macOS with compiled Runtime
        run: node scripts/build-desktop.mjs --mac dmg zip --publish never

      - name: Packaged startup smoke
        run: npm run test:startup -- release/desktop

      - name: Verify package contents
        run: npm run verify:package

      - name: Upload macOS PR installers
        uses: actions/upload-artifact@v6
        with:
          name: MeetingNotes-macOS-PR
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
