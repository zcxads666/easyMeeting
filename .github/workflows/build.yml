name: Desktop CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CI: "true"
  MEETING_RUNTIME_AUTO_INSTALL: "0"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  quality:
    name: Tests and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build web renderer
        run: npm run build

      - name: Create Python test runtime
        run: npm run setup:python

      - name: Run Node and system tests
        run: npm test

      - name: Run Python tests
        run: npm run test:python

      - name: Check patch whitespace
        run: git diff --check

  package:
    name: Package ${{ matrix.name }}
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            artifact: MeetingNotes-Windows
          - name: macOS
            os: macos-15
            artifact: MeetingNotes-macOS
          - name: Linux
            os: ubuntu-24.04
            artifact: MeetingNotes-Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web renderer
        run: npm run build

      - name: Install Electron smoke dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          xvfb libnspr4 libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64
          libgbm1 libasound2t64

      - name: Configure Electron sandbox helper
        if: runner.os == 'Linux'
        run: |
          test -f node_modules/electron/dist/chrome-sandbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          stat -c '%A %U:%G %n' node_modules/electron/dist/chrome-sandbox

      - name: Electron smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a env ELECTRON_SMOKE_TEST=1 ELECTRON_ENABLE_LOGGING=1 timeout 60s npm run desktop

      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run desktop:dist -- --win nsis --publish never

      - name: Package macOS
        if: runner.os == 'macOS'
        run: npm run desktop:dist -- --mac dmg zip --publish never

      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run desktop:dist -- --linux AppImage --publish never

      - name: Verify package contents
        run: npm run verify:package

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/desktop/*.exe
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.AppImage
            release/desktop/*.blockmap
            release/desktop/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
